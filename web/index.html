<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pit Wall · Central de Corrida</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/charts.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div><p class="eyebrow">F1 / CENTRAL DE CORRIDA</p><h1>Pit Wall<span>.</span></h1></div>
    <div class="badge"><i></i> Pós-corrida</div>
  </header>
  <main>
    <section class="hero panel">
      <div class="hero-title">
        <div><p class="eyebrow">CORRIDA SELECIONADA</p><h2 id="race-title">Carregando corridas</h2></div>
        <button id="reload" type="button">Atualizar</button>
      </div>
      <p id="source" class="muted"></p>
      <div class="controls">
        <label>Corrida<select id="event"></select></label>
        <label>Piloto<select id="driver"></select></label>
        <button id="analyze" type="button" class="primary" disabled>Analisar estratégia do piloto ↗</button>
      </div>
      <p id="status" class="muted" role="status"></p>
    </section>
    <div id="content" hidden>
      <nav id="tabs" aria-label="Seções da corrida">
        <button type="button" data-tab="overview" aria-current="page">Visão geral</button>
        <button type="button" data-tab="pace">Ritmo e posições</button>
        <button type="button" data-tab="pits">Pneus e boxes</button>
        <button type="button" data-tab="weather">Clima</button>
        <button type="button" data-tab="telemetry">Telemetria</button>
        <button type="button" data-tab="control">Direção de prova</button>
        <button type="button" data-tab="analysis">Análise do piloto</button>
      </nav>
      <section id="view" aria-live="polite"></section>
    </div>
  </main>
  <footer>Pit Wall · Análise local de Fórmula 1</footer>
</body>
</html>
